name: socialflow_ai
description: Architecture Flutter évolutive pour SocialFlow AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  flutter_riverpod: ^3.1.0
  flutter_cache_manager: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  app_links: ^6.4.1
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
